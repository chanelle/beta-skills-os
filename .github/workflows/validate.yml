name: Validate skill definitions and runtime
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate skills and assets
        run: python scripts/validate_skills.py
      - name: Runtime tests
        run: cd runtime && python -m unittest discover -s tests -v
